name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: sketchflow-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-real-0123456789
      GITHUB_CLIENT_ID: ci-github-client-id
      GITHUB_CLIENT_SECRET: ci-github-client-secret
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sketchflow
      NEXT_PUBLIC_APP_URL: https://sketchflow.space
      GITHUB_API_VERSION: "2022-11-28"
      GITHUB_OAUTH_SCOPES: "repo,read:user,user:email"
      SKETCHFLOW_REPO_NAME: sketchflow-ci
      SKETCHFLOW_DEFAULT_BRANCH: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Smoke test
        run: |
          bunx next start -p 3100 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3100/help && break; sleep 1; done
          node scripts/smoke.mjs http://localhost:3100

      - name: Install browser for end-to-end tests
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e
