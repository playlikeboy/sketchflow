name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: sketchflow-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
      NEXT_PUBLIC_STACK_PROJECT_ID: ci-project
      NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: ci-publishable-key
      STACK_SECRET_SERVER_KEY: ci-server-key
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sketchflow
      NEXT_PUBLIC_APP_URL: https://sketchflow.space
      GITHUB_API_VERSION: "2022-11-28"
      GITHUB_OAUTH_SCOPES: "repo,read:user,user:email"
      SKETCHFLOW_REPO_NAME: sketchflow-ci
      SKETCHFLOW_DEFAULT_BRANCH: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
