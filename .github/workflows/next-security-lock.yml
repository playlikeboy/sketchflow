name: One-time Next.js security lock refresh

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh:
    if: startsWith(github.event.head_commit.message, 'chore: security upgrade Next.js')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Refresh lockfile
        run: bun install --lockfile-only

      - name: Commit lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh bun lockfile for Next.js security patch"
          git push
