name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sketchflow-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    # Secrets are scoped to the steps that need them so dependency install scripts,
    # tests, and lint never see deploy credentials.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            .next/cache
          key: ${{ runner.os }}-sketchflow-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**/*', 'public/**/*', 'next.config.ts', 'open-next.config.ts', 'wrangler.jsonc') }}
          restore-keys: |
            ${{ runner.os }}-sketchflow-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-sketchflow-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Verify deploy secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.SKETCHFLOW_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.SKETCHFLOW_GITHUB_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          GITHUB_API_VERSION: ${{ secrets.SKETCHFLOW_GITHUB_API_VERSION }}
          GITHUB_OAUTH_SCOPES: ${{ secrets.SKETCHFLOW_GITHUB_OAUTH_SCOPES }}
          SKETCHFLOW_REPO_NAME: ${{ secrets.SKETCHFLOW_REPO_NAME }}
          SKETCHFLOW_DEFAULT_BRANCH: ${{ secrets.SKETCHFLOW_DEFAULT_BRANCH }}
        run: |
          missing=()
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            BETTER_AUTH_SECRET \
            GITHUB_CLIENT_ID \
            GITHUB_CLIENT_SECRET \
            DATABASE_URL \
            NEXT_PUBLIC_APP_URL \
            GITHUB_API_VERSION \
            GITHUB_OAUTH_SCOPES \
            SKETCHFLOW_REPO_NAME \
            SKETCHFLOW_DEFAULT_BRANCH
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required deploy secrets/env values:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.SKETCHFLOW_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.SKETCHFLOW_GITHUB_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          GITHUB_API_VERSION: ${{ secrets.SKETCHFLOW_GITHUB_API_VERSION }}
          GITHUB_OAUTH_SCOPES: ${{ secrets.SKETCHFLOW_GITHUB_OAUTH_SCOPES }}
          SKETCHFLOW_REPO_NAME: ${{ secrets.SKETCHFLOW_REPO_NAME }}
          SKETCHFLOW_DEFAULT_BRANCH: ${{ secrets.SKETCHFLOW_DEFAULT_BRANCH }}
        run: bun run deploy
